<!--
  vagaí — página servida pelo ESP32 do car (esp32/car/car.ino), sem bibliotecas.
  Visual em css/estilo.css (segue o DESIGN.md); código em módulos de js/, a partir de js/main.js.
  O ESP32 recebe tudo num arquivo só: esp32/gerar_pagina.py embute o CSS e junta os módulos.

  Modo em js/config.js: em teste, sem conexão com o ESP32, mostra vagas e leituras simuladas
  com um aviso fixo no topo; em produção, só dados reais. A página do ESP32 sai sempre em produção.
  Para testar no computador: python3 -m http.server -d html e abra http://localhost:8000
  (com ?esp=192.168.4.1, lê um ESP32 na rede).
-->
<link rel="stylesheet" href="css/estilo.css">
</head>

<div class="site" id="app"></div>
<script type="module" src="js/main.js"></script>
